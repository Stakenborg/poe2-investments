name: Process Fund Update
on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON payload'
        required: true
        type: string
  schedule:
    # Every 8 hours at 00:00 / 08:00 / 16:00 UTC. Scheduled runs do a
    # fetch-only batch (see the Process step's payload default).
    - cron: '0 */8 * * *'

# Serialize runs so a scheduled fetch and a manual console run never
# push concurrently and conflict on the data files.
concurrency:
  group: fund-update
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config user.name "The Vault Bot"
          git config user.email "vault-bot@users.noreply.github.com"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests python-dotenv
      - name: Create .env
        run: |
          echo "POESESSID=${{ secrets.POESESSID }}" >> .env
          echo "LEAGUE=${{ secrets.LEAGUE }}" >> .env
          echo "ACCOUNT=${{ secrets.ACCOUNT }}" >> .env
          echo "INVESTORS_KEY=${{ secrets.INVESTORS_KEY }}" >> .env
      - name: Process
        # On manual dispatch, use the console-supplied payload. On a
        # scheduled run there is no input, so default to a fetch-only batch.
        env:
          PAYLOAD: ${{ inputs.payload || '{"fetch":true}' }}
        run: python fetch_trades.py --batch "$PAYLOAD" --push
